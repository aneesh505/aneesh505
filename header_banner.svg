<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace">
  <defs>
    <!-- Pure Black to Dark Charcoal Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Subtle White / Light Gray Shimmer Gradient for ASCII Text -->
    <linearGradient id="bwGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b949e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 600 0; -600 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="cardClip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#bgGrad)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- Subtle Star Dust Particles -->
    <circle cx="120" cy="70" r="1" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="290" r="1.2" fill="#8b949e" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="80" r="1" fill="#ffffff" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="270" r="1.2" fill="#8b949e" opacity="0.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.5s" repeatCount="indefinite"/></circle>

    <!-- Perfectly Centered ASCII Art Spelling ANEESH -->
    <text x="600" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      █████╗ &#160;███╗ &#160; ██╗███████╗███████╗███████╗██╗ &#160; &#160;
    </text>
    <text x="600" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      ██╔══██╗████╗ &#160;██║██╔════╝██╔════╝██╔════╝██║ &#160; &#160;
    </text>
    <text x="600" y="149" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      ███████║██╔██╗ &#160;██║█████╗ &#160;█████╗ &#160;███████╗██║ &#160; &#160;
    </text>
    <text x="600" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      ██╔══██║██║╚██╗ ██║██╔══╝ &#160;██╔══╝ &#160;╚════██║██║ &#160; &#160;
    </text>
    <text x="600" y="203" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      ██║ &#160;██║██║ &#160;╚████║███████╗███████╗███████║███████╗
    </text>
    <text x="600" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#bwGrad)" letter-spacing="1" xml:space="preserve">
      ╚═╝ &#160;╚═╝╚═╝ &#160; ╚═══╝╚══════╝╚══════╝╚══════╝╚══════╝
    </text>

    <!-- Subtitle in ASCII style -->
    <text x="600" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e7681" letter-spacing="4">
      FULL-STACK WEB DEVELOPER &#160;•&#160; OPEN SOURCE &#160;•&#160; BUILDER
    </text>
  </g>

  <!-- Clean Border Frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="22" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
