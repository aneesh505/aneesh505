<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace">
  <defs>
    <!-- Vibrant Distinct Cyberpunk / Deep Space Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#141124"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#39c5bb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39c5bb" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Shimmer Gradient for ASCII Name -->
    <linearGradient id="asciiGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="30%" stop-color="#79c0ff"/>
      <stop offset="70%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#ff7b72"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 600 0; -600 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#79c0ff" fill-opacity="0.1"/>
    </pattern>

    <clipPath id="cardClip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#bgGrad)"/>
    <rect width="1200" height="340" fill="url(#dotGrid)"/>
    <rect width="1200" height="340" fill="url(#glow1)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>

    <!-- Floating Star Particles -->
    <circle cx="150" cy="80" r="1.5" fill="#ffffff" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="280" r="1" fill="#79c0ff" opacity="0.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="70" r="1.5" fill="#ff7b72" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="260" r="1.2" fill="#39c5bb" opacity="0.7"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/></circle>

    <!-- ASCII Art Spelling ANEESH SUVARNA -->
    <text x="600" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      █████╗ &#160;███╗ &#160; ██╗███████╗███████╗███████╗██╗
    </text>
    <text x="600" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      ██╔══██╗████╗ &#160;██║██╔════╝██╔════╝██╔════╝██║
    </text>
    <text x="600" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      ███████║██╔██╗ &#160;██║█████╗ &#160;█████╗ &#160;███████╗██║
    </text>
    <text x="600" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      ██╔══██║██║╚██╗ ██║██╔══╝ &#160;██╔══╝ &#160;╚════██║██║
    </text>
    <text x="600" y="205" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      ██║ &#160;██║██║ &#160;╚████║███████╗███████╗███████║███████╗
    </text>
    <text x="600" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#asciiGrad)" letter-spacing="2" xml:space="preserve">
      ╚═╝ &#160;╚═╝╚═╝ &#160; ╚═══╝╚══════╝╚══════╝╚══════╝╚══════╝
    </text>

    <!-- Second Line / Subtitle -->
    <text x="600" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b949e" letter-spacing="4">
      FULL-STACK WEB DEVELOPER &#160;•&#160; OPEN SOURCE &#160;•&#160; BUILDER
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="22" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
